<!--
  Hand-made, and staying so until a signed-in session with the out-of-office reply on is captured: Gmail's banner as 3.x anchored it, `:7` holding `:k`, with the link to the settings page that turns the reply off.
-->
<div id=":7">
  <div id=":k" role="alert">
    <span>Your vacation responder is on.</span>
    <a href="https://mail.google.com/mail/u/0/#settings/general"
      >Vacation Settings</a
    >
    <span role="link">End now</span>
  </div>
</div>
<div role="main"></div>
